name: CI

on:
  # Only main on push: a branch with an open PR would otherwise run every job
  # twice, once per trigger.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two Go versions upstream currently supports.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  shell:
    name: Shell examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The hook is the part a user installs between an agent and their
      # filesystem, so it is held to the same bar as the Go code.
      - name: ShellCheck
        run: shellcheck examples/claude-code-hook/*.sh

  eval:
    name: Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # The rules-only arm needs no network and no credentials, so it can run
      # on every pull request. A change in these numbers is a change in
      # behaviour, and should be visible in review.
      - name: Score the rules against the labelled dataset
        run: go run ./tools/eval

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # Builds every target, archives and checksums exactly as a tagged
      # release would, without publishing anything. The release workflow only
      # runs on a tag, so without this the packaging would first be exercised
      # on the day it matters.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: List artifacts
        run: |
          ls -l dist/*.tar.gz
          cat dist/checksums.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
