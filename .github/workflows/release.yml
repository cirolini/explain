name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Needed to attest that these artifacts were built by this workflow from
  # this commit. Release binaries for 1.0.0 were uploaded by hand, with
  # nothing tying them to the source.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the history, so it needs all
          # of it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tar.gz"
